name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing ghcr.io image tag to redeploy (commit SHA). Leave empty to build and deploy HEAD.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  docker_image_build:
    name: Docker image build
    runs-on: ubuntu-latest

    if: inputs.image_tag == ''

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Cache Yarn cache + node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build frontend web apps
        run: yarn build --filter=admin... --filter=app...

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},
            ghcr.io/${{ github.repository }}:${{ github.ref_name }},
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'latest' || 'unstable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ansible_playbook:
    name: Run Ansible playbook
    runs-on: ubuntu-latest

    needs:
      - docker_image_build

    if: ${{ !cancelled() && (needs.docker_image_build.result == 'success' || needs.docker_image_build.result == 'skipped') }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: './infrastructure/ansible/requirements.txt'

      - name: Install Ansible
        run: |
          pip install -r ./infrastructure/ansible/requirements.txt

      - name: Cache Ansible collections and roles
        id: galaxy-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ hashFiles('infrastructure/ansible/requirements.yml') }}

      - name: Install Ansible dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy install -r ./infrastructure/ansible/requirements.yml

      - name: Setup sops
        uses: mdgreenwald/mozilla-sops-action@v2.1.2
        with:
          version: v3.13.3

      - name: Login to AWS
        id: aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::763640948377:role/futsal-app-github-deploy
          aws-region: us-east-1
          output-credentials: true
          output-env-credentials: false

      - name: Configure futsal-app AWS profile
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile futsal-app
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile futsal-app
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile futsal-app

      - name: Run Ansible playbook
        run: |
          eval $(ssh-agent)
          ./infrastructure/scripts/ansible-playbook.sh ${{ github.ref_name == 'main' && 'production' || github.ref_name }} api \
            -e "docker_image=ghcr.io/${{ github.repository }}:${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}"
