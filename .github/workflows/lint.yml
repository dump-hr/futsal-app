name: Lint

on:
  push:
  workflow_dispatch:

jobs:
  eslint_admin:
    name: Run ESLint (admin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run types build
        run: yarn workspace @futsal-app/types build

      - name: Run ESLint
        run: yarn workspace admin run lint

  eslint_app:
    name: Run ESLint (app)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run types build
        run: yarn workspace @futsal-app/types build

      - name: Run ESLint
        run: yarn workspace app run lint

  eslint_api:
    name: Run ESLint (api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run types build
        run: yarn workspace @futsal-app/types build

      - name: Run ESLint
        run: yarn workspace api run lint
